name: AWS CDK Diff PR Commenter
description: Post the output of `cdk diff` to a Pull Request comment.
author: Towards the Cloud
branding:
  icon: git-pull-request
  color: orange
inputs:
  diff-file:
    description: Path to the CDK diff output file. Required when source-type is cdk.
  source-type:
    description: Structured template source type. Either cdk or cloudformation.
    default: cdk
  before-template:
    description: Path to the base CloudFormation template or CDK cloud assembly.
  after-template:
    description: Path to the head CloudFormation template or CDK cloud assembly.
  stack-name:
    description: Stable stack name when before-template and after-template are individual template files.
  token:
    description: The GitHub or PAT token to use for posting comments to Pull Requests.
    default: ${{ github.token }}
  header:
    description: Set a custom header to use for the Pull Request comment.
  aws-region:
    description: The AWS region where the infrastructure changes are being applied e.g. us-east-1.
outputs:
  markdown:
    description: The raw markdown output of the `cdk diff` command
  empty:
    description: Whether the `cdk diff` contains any changes or not
  resource-changes:
    description: The validated CloudBurn Resource Change Set JSON when one was produced
runs:
  using: node24
  main: build/index-cdk.js
